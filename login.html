 <form id="entrar" autocomplete="off">

<script>
(function () {
  'use strict';
  var erro = document.getElementById('erro');
  document.getElementById('entrar').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = document.getElementById('utilizador').value.trim();
    var c = document.getElementById('codigo').value;
    if (u.toLowerCase() === SGI_UTILIZADOR.toLowerCase() && c === SGI_CODIGO) {
      var guardou = false;
      try { localStorage.setItem('zt_sgi_sessao', 'ok'); guardou = true; } catch (err) {}
      if (!guardou) {
        try { sessionStorage.setItem('zt_sgi_sessao', 'ok'); } catch (err) {}
      }
      location.replace('index.html');
      return;
    }
    erro.textContent = 'Utilizador ou código incorrecto.';
    erro.style.display = 'block';
    document.getElementById('codigo').value = '';
    document.getElementById('codigo').focus();
  });
}());
</script>
